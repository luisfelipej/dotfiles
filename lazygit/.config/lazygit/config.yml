gui:
  # lazygit picks lightTheme or darkTheme from the terminal background, so it
  # follows the macOS appearance along with Ghostty.
  colorScheme: auto
  darkTheme: # Kanagawa Wave
    activeBorderColor:
      - "#7e9cd8"
      - bold
    inactiveBorderColor:
      - "#54546d"
    searchingActiveBorderColor:
      - "#e6c384"
      - bold
    optionsTextColor:
      - "#7e9cd8"
    selectedLineBgColor:
      - "#2d4f67"
    cherryPickedCommitBgColor:
      - "#54546d"
    cherryPickedCommitFgColor:
      - "#e6c384"
    markedBaseCommitBgColor:
      - "#54546d"
    markedBaseCommitFgColor:
      - "#e46876"
    unstagedChangesColor:
      - "#e46876"
    defaultFgColor:
      - "#dcd7ba"
    authorColors:
      "*": "#d27e99"
  lightTheme: # Zenwritten Light
    activeBorderColor:
      - "#286486"
      - bold
    inactiveBorderColor:
      - "#aca9a9"
    searchingActiveBorderColor:
      - "#944927"
      - bold
    optionsTextColor:
      - "#286486"
    selectedLineBgColor:
      - "#d7d7d7"
    cherryPickedCommitBgColor:
      - "#e2e2e2"
    cherryPickedCommitFgColor:
      - "#803d1c"
    markedBaseCommitBgColor:
      - "#e2e2e2"
    markedBaseCommitFgColor:
      - "#a8334c"
    unstagedChangesColor:
      - "#a8334c"
    defaultFgColor:
      - "#353535"
    authorColors:
      "*": "#88507d"
  nerdFontsVersion: "3"
