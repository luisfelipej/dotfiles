add_newline = false

format = """
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$git_metrics\
$kubernetes\
$golang\
$nodejs\
$cmd_duration\
$fill\
$time\
$line_break\
$character"""

[fill]
symbol = " "

[directory]
style = "bold blue"
read_only = " "
truncation_length = 4
truncate_to_repo = false

[character]
success_symbol = "[󰜴](bold bright-yellow)"
error_symbol = "[󰜴](bold red)"
vicmd_symbol = "[󰜴](bold bright-green)"

[git_branch]
symbol = " "
format = 'on [$symbol$branch(:$remote_branch)]($style) '
style = "bold purple"
truncation_length = 20
truncation_symbol = "..."

[git_status]
format = '([\[$all_status$ahead_behind\]]($style) )'
style = "bright-cyan"
conflicted = "🏳"
ahead = "🏎💨"
behind = "😰"
diverged = "😵"
up_to_date = "✓"

[git_metrics]
disabled = false
added_style = "bold bright-green"
deleted_style = "bold red"

[golang]
symbol = " "
style = "bold blue"
format = "[$symbol($version) ]($style)"

[nodejs]
symbol = "⬢ "
style = "bold bright-green"
format = "[$symbol($version) ]($style)"

[docker_context]
symbol = " "
style = "blue dimmed"

[kubernetes]
symbol = "⎈ "
disabled = false
style = "bright-cyan"
format = 'on [$symbol$context( \($namespace\))]($style) '

[[kubernetes.contexts]]
context_pattern = ".*ProdEKS.*"
context_alias = "prod"
style = "bold red"

[[kubernetes.contexts]]
context_pattern = ".*DevEKS.*"
context_alias = "dev"
style = "bold bright-green"

[cmd_duration]
min_time = 2_000
style = "bold bright-yellow"
format = "took [$duration]($style) "

[time]
disabled = false
style = "bold bright-yellow"
format = "[$time]($style)"
time_format = "%H:%M"

[jobs]
symbol = ""
style = "bold red"
number_threshold = 1
format = "[$symbol]($style)"

[aws]
disabled = true

[package]
disabled = true
