# Carga TPM
set-option -g automatic-rename

# Tested options for TMUX compatibility
set -g @plugin 'tmux-plugins/tmux-sensible'

# Clipboard management
set -g @plugin 'tmux-plugins/tmux-yank'

# Tmux Navigation
set -g @plugin 'christoomey/vim-tmux-navigator'

# Tmux Resurrect
set -g @plugin 'tmux-plugins/tmux-resurrect'

# Which Key
set -g @plugin 'alexwforsythe/tmux-which-key'

# Floating window
bind-key -n M-g if-shell -F '#{==:#{session_name},scratch}' {
  detach-client
} {
  # open in the same directory of the current pane
  display-popup -d "#{pane_current_path}" -E "tmux new-session -A -s scratch"
}


# === Minimal (ANSI colors, so the bar follows the Ghostty palette) ===
set -g status-style "bg=default,fg=default"
set -g status-justify left
set -g status-left-length 100

set -g status-left "#[fg=red,bold]  #S #[fg=brightblack]│ "

# Nombre de ventana: los panes de Claude Code reportan su NUMERO DE VERSION
# en pane_current_command (2.1.241), no su nombre, asi que #W salia inservible.
# Etiquetamos por directorio. Claude es la norma y va sin icono; solo la
# shell lleva marca, que es el caso raro.
set -g automatic-rename-format "#{?#{m:[0-9]*.[0-9]*.[0-9]*,#{pane_current_command}},,󰈺 }#{?#{==:#{pane_current_path},$HOME},~,#{b:pane_current_path}}"

set -g window-status-separator ""
set -g window-status-format         "#[fg=brightblack] #I:#W "
set -g window-status-current-format "#[fg=blue,bold] #I:#W "

# Lado derecho: solo estado de tmux, lo unico que sketchybar no puede ver.
# Rinde vacio mientras no pasa nada, asi que la barra sigue limpia.
# Ojo, hay que setearlo explicitamente: si se borra la linea, tmux aplica su
# default ("#{=21:pane_title}" %H:%M %d-%b-%y).
set -g status-right "#[fg=brightyellow]#{?client_prefix,PREFIX ,}#[fg=blue]#{?pane_in_mode,#{pane_mode} ,}#[fg=red]#{?window_zoomed_flag,ZOOM ,}"

set -g pane-border-style        "fg=brightblack"
set -g pane-active-border-style "fg=red"

set -g message-style         "bg=default,fg=default,bold"
set -g message-command-style "bg=default,fg=default,bold"
set -g mode-style            "bg=blue,fg=black"

set -g clock-mode-colour "blue"
set -g clock-mode-style 24



# --- terminal & key handling ---
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:Tc"

set -g extended-keys always
set -g extended-keys-format csi-u
set -as terminal-features 'xterm*:extkeys'

# Modo vim
set -g mode-keys vi
if-shell 'uname | grep -q Darwin' \
  'bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"' \
  'bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "clip"'

# Keymaps
unbind C-b
set -g prefix C-a
bind C-a send-prefix

unbind %
unbind '"'
bind v split-window -h -c "#{pane_current_path}"
bind d split-window -v -c "#{pane_current_path}"

# Mouse support
set -g mouse on

# Status bar position
set -g status-position top

# Kill all sessions except current
bind K confirm-before -p "Kill all other sessions? (y/n)" "kill-session -a"

# Fix index
set -g base-index 1
setw -g pane-base-index 1

# TPM init
run '~/.tmux/plugins/tpm/tpm'
set-option -g default-shell /opt/homebrew/bin/fish

set -g set-clipboard on
set -ga terminal-overrides ',*:Ms=\E]52;%p1%s;%p2%s\007'
