# AeroSpace config — Grimm-inspired tiling
# Docs: https://nikitabobko.github.io/AeroSpace/guide

# Start AeroSpace at login
start-at-login = true

# Notify Sketchybar about workspace change
exec-on-workspace-change = ['/bin/bash', '-c',
    'sketchybar --trigger aerospace_workspace_change FOCUSED_WORKSPACE=$AEROSPACE_FOCUSED_WORKSPACE'
]

# Start JankyBorders on session start
after-startup-command = [
    'exec-and-forget /opt/homebrew/bin/borders',
]

# Don't auto-tile system apps that misbehave
[[on-window-detected]]
if.app-id = 'com.apple.systempreferences'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.finder'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.1password.1password'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.raycast.macos'
run = 'layout floating'

# Gaps uniformes = 12px, para que las ventanas respiren igual que el margen
# lateral de la barra flotante de SketchyBar (armonía visual).
[gaps]
inner.horizontal = 12
inner.vertical = 12
outer.left = 12
outer.right = 12
# SketchyBar flota con y_offset=12 + height=32 + border=2 (borde inferior ≈ y=46).
# Para dejar el mismo respiro de 12px entre la barra y la ventana superior:
# externo (sin notch, menú auto-oculto, embaldosa desde y=0) ≈ 46 + 12 = 58 → 56.
# built-in: el notch ya reserva la franja; ~52 (VERIFICAR/AJUSTAR en el MacBook).
outer.top = [
    { monitor.'built-in.*' = 49 },
    53,
]
outer.bottom = 12

# === Main mode ===
[mode.main.binding]

# Reload config
alt-shift-c = 'reload-config'

# Layout
alt-slash = 'layout tiles horizontal vertical'
alt-comma = 'layout accordion horizontal vertical'

# Focus (vim-style)
alt-h = 'focus left'
alt-j = 'focus down'
alt-k = 'focus up'
alt-l = 'focus right'

# Move window
alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'

# Resize
alt-minus = 'resize smart -50'
alt-equal = 'resize smart +50'

# Workspaces — switch
alt-1 = 'workspace 1'
alt-2 = 'workspace 2'
alt-3 = 'workspace 3'
alt-4 = 'workspace 4'
alt-5 = 'workspace 5'
alt-6 = 'workspace 6'
alt-7 = 'workspace 7'
alt-8 = 'workspace 8'
alt-9 = 'workspace 9'

# Workspaces — move window to workspace N
alt-shift-1 = 'move-node-to-workspace 1'
alt-shift-2 = 'move-node-to-workspace 2'
alt-shift-3 = 'move-node-to-workspace 3'
alt-shift-4 = 'move-node-to-workspace 4'
alt-shift-5 = 'move-node-to-workspace 5'
alt-shift-6 = 'move-node-to-workspace 6'
alt-shift-7 = 'move-node-to-workspace 7'
alt-shift-8 = 'move-node-to-workspace 8'
alt-shift-9 = 'move-node-to-workspace 9'

# Toggle floating
alt-shift-space = 'layout floating tiling'

# Fullscreen
alt-f = 'fullscreen'

# Cycle through monitors / workspaces
alt-tab = 'workspace-back-and-forth'
alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'

# Enter resize sub-mode
alt-r = 'mode resize'

[mode.resize.binding]
h = 'resize width -50'
j = 'resize height +50'
k = 'resize height -50'
l = 'resize width +50'
enter = 'mode main'
esc = 'mode main'
